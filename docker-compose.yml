services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-bank}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?set MONGO_PASS in .env}
    volumes: [mongo-data:/data/db]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
  server:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-bank}:${MONGO_PASS}@mongo:27017/bank?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 5000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["127.0.0.1:5000:5000"]
    networks: [internal]
  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["127.0.0.1:8000:8080"]
    networks: [internal]
volumes:
  mongo-data:
networks:
  internal:
