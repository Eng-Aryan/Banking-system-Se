server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:" always;
  location /api/ { proxy_pass http://server:5000; proxy_set_header X-Forwarded-For $remote_addr; }
  location / { try_files $uri /index.html; }
}
